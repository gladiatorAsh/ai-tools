# Curated catalog of open-source AI tools.
#
# Hand-maintained fields live here; GitHub metrics live in data/metrics.json
# (refreshed by `python -m ai_tools refresh`). Every repo listed here must have
# an entry in data/metrics.json - the test suite enforces this.
#
# Field reference
#   repo              owner/name on GitHub (canonical name after redirects)
#   category          one of the keys in `categories` below
#   summary           one line, what it is
#   use_cases         where it earns its place in a production AI app
#   mode              library | service | mcp | dev-tool | poc | reject   (see docs/EVALUATION.md)
#   relevance         0-10 ESTIMATE - value for building production AI apps
#   quality           0-10 ESTIMATE - technical depth, design, docs
#   integration       0-10 ESTIMATE - ease of adoption; 10 = pip/npm install, 0 = heavy infra
#   license_class     permissive | open-core | source-available | copyleft | model-license
#   license_note      optional, from reading the repo's LICENSE file
#   flags             optional list of risk flags (shown in README)
#   reason            required when mode == reject
#   security_penalty  optional 0-10, subtracted from the license score for known security concerns

categories:
  orchestration: LLM frameworks & orchestration
  agents: Agents & multi-agent systems
  memory: Agent memory & knowledge graphs
  mcp: Model Context Protocol (servers, SDKs)
  rag: RAG, hybrid search & reranking
  vector-db: Vector databases & retrieval stores
  inference: Local & self-hosted inference
  coding-agents: Coding agents & AI dev tools
  evaluation: Evaluation, observability & tracing
  document-processing: Document processing & extraction
  security: Security, guardrails & red teaming
  workflow: Workflow automation, browsing & crawling
  ui: UI & AI application frameworks

